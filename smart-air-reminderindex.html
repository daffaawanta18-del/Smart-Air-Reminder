<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Air Reminder — SAR1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,560;1,9..144,500;1,9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2321;
    --ink-soft:#57625D;
    --mist:#E7EDE6;
    --paper:#FBFAF6;
    --line:rgba(28,35,33,0.12);

    --clear:#1E7A63;
    --clear-soft:#DCEEE7;
    --haze:#C6862B;
    --haze-soft:#F3E6CC;
    --smog:#B0442E;
    --smog-soft:#F3DAD2;
    --neutral:#8A8F86;
    --neutral-soft:#E4E6E1;

    --status-color: var(--neutral);
    --status-soft: var(--neutral-soft);
    --breathe-duration: 4.5s;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(60% 50% at 15% 0%, rgba(30,122,99,0.07), transparent),
      radial-gradient(50% 40% at 100% 10%, rgba(198,134,43,0.06), transparent),
      var(--mist);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{
    max-width:920px;
    margin:0 auto;
    padding:28px 20px 60px;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    margin-bottom:36px;
  }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 6px;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:560;
    font-size:clamp(26px, 4vw, 34px);
    margin:0;
    letter-spacing:-0.01em;
  }

  .status-pill{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--ink-soft);
    background:var(--paper);
    border:1px solid var(--line);
    padding:7px 12px 7px 10px;
    border-radius:999px;
    white-space:nowrap;
  }

  .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--neutral);
    flex:none;
  }
  .dot.online{ background:var(--clear); box-shadow:0 0 0 3px var(--clear-soft); }
  .dot.error{ background:var(--smog); box-shadow:0 0 0 3px var(--smog-soft); }

  /* ---------- Hero / breathing circle ---------- */
  .hero{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:34px 20px 14px;
  }

  .breathe-ring{
    width:220px; height:220px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 32% 28%, var(--status-soft), transparent 60%), var(--paper);
    border:1px solid var(--line);
    box-shadow: 0 0 0 10px var(--status-soft);
    animation: breathe var(--breathe-duration) ease-in-out infinite;
    transition: box-shadow .6s ease, background .6s ease;
  }

  @keyframes breathe{
    0%, 100%{ transform:scale(1); }
    50%{ transform:scale(1.045); }
  }

  @media (prefers-reduced-motion: reduce){
    .breathe-ring{ animation:none; }
  }

  .status-word{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:26px;
    color:var(--status-color);
    transition:color .6s ease;
  }

  .hero-caption{
    margin-top:18px;
    font-size:14.5px;
    color:var(--ink-soft);
  }
  .hero-caption span{
    font-family:'IBM Plex Mono', monospace;
    color:var(--ink);
  }

  /* ---------- Metric grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:14px;
    margin-top:38px;
  }

  @media (max-width:640px){
    .grid{ grid-template-columns:repeat(2, 1fr); }
  }

  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 16px 14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .card-label{
    align-self:flex-start;
    font-size:12px;
    letter-spacing:0.04em;
    color:var(--ink-soft);
    margin:0 0 4px;
  }

  /* ---------- gauge bulat (gaya Blynk) ---------- */
  .gauge-wrap{
    position:relative;
    width:132px;
    height:124px;
    margin:2px 0 0;
  }
  .gauge-wrap svg{ width:100%; height:100%; display:block; overflow:hidden; }
  .gauge-track{ fill:none; stroke:var(--mist); stroke-width:9; stroke-linecap:round; }
  .gauge-fill{
    fill:none;
    stroke:var(--ink-soft);
    stroke-width:9;
    stroke-linecap:round;
    stroke-dasharray:0 1000;
    transition:stroke-dasharray .6s ease, stroke .6s ease;
  }
  .gauge-readout{
    position:absolute;
    left:50%; top:52%;
    transform:translate(-50%,-50%);
    text-align:center;
    line-height:1;
    white-space:nowrap;
  }

  .card-value{
    font-family:'IBM Plex Mono', monospace;
    font-weight:500;
    font-size:19px;
    line-height:1;
  }
  .card-unit{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-left:2px;
  }

  .gauge-range{
    display:flex;
    justify-content:space-between;
    width:100%;
    font-family:'IBM Plex Mono', monospace;
    max-width:112px;
    margin:0 auto;
    font-size:10.5px;
    color:var(--ink-soft);
    margin-top:6px;
    padding:0 2px;
  }

  .gauge-dot-row{
    display:flex;
    align-items:center;
    gap:5px;
    margin-top:6px;
  }
  .gauge-dot-row .dot{ margin:0; }
  .gauge-dot-row .dot-lbl{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--ink-soft);
  }

  /* ---------- Footer ---------- */
  .foot{
    margin-top:32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    font-size:13px;
    color:var(--ink-soft);
  }

  .refresh-btn{
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    padding:9px 16px;
    border-radius:999px;
    cursor:pointer;
  }
  .refresh-btn:hover{ border-color:var(--ink-soft); }
  .refresh-btn:focus-visible{ outline:2px solid var(--clear); outline-offset:2px; }
  .refresh-btn:disabled{ opacity:.55; cursor:default; }

  .error-note{
    margin-top:18px;
    padding:12px 14px;
    border-radius:10px;
    background:var(--smog-soft);
    color:#7A2F1E;
    font-size:13.5px;
    line-height:1.5;
    display:none;
  }
  .error-note.show{ display:block; }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div>
      <p class="eyebrow">Smart Air Reminder · Device SAR1</p>
      <h1>Kualitas udara ruangan</h1>
    </div>
    <div class="status-pill">
      <span class="dot" id="connDot"></span>
      <span id="connLabel">Menghubungkan…</span>
    </div>
  </header>

  <section class="hero">
    <div class="breathe-ring" id="breatheRing">
      <span class="status-word" id="statusWord">…</span>
    </div>
    <p class="hero-caption">Berdasarkan kadar CO₂ saat ini: <span id="co2Caption">— ppm</span></p>
  </section>

  <section class="grid" id="metricGrid"><!-- diisi lewat JS --></section>

  <p class="error-note" id="errorNote"></p>

  <div class="foot">
    <span id="lastUpdated">Belum ada data.</span>
    <button class="refresh-btn" id="refreshBtn">Refresh sekarang</button>
  </div>

</div>

<script>
  // ====================== KONFIGURASI ======================
  // Ambil dari Device Info di Blynk Console kalau token berubah.
  const BLYNK_TOKEN = "VmzkBg-3ZUwG0SEsOuy6X2gpHWeXfdnW";
  const REFRESH_MS = 5000;
  // ===========================================================

  const METRICS = [
    { pin:'v0', label:'Karbon monoksida', short:'CO',      unit:'ppm', max:1000 },
    { pin:'v1', label:'Alkohol',          short:'Alcohol', unit:'ppm', max:300  },
    { pin:'v2', label:'Karbon dioksida',  short:'CO2',     unit:'ppm', max:5000 },
    { pin:'v3', label:'Toluena',          short:'Toluene', unit:'ppm', max:300  },
    { pin:'v4', label:'Amonia (NH4)',     short:'NH4',     unit:'ppm', max:300  },
    { pin:'v5', label:'Aseton',           short:'Acetone', unit:'ppm', max:300  },
  ];

  const STATUS_STYLE = {
    'AMAN':       { color:'--clear', soft:'--clear-soft', breathe:'5.2s' },
    'SEDANG':     { color:'--haze',  soft:'--haze-soft',  breathe:'3.2s' },
    'TIDAK AMAN': { color:'--smog',  soft:'--smog-soft',  breathe:'1.7s' },
  };

  // ---- helper: bikin path arc SVG (gauge 270°, gaya speedometer Blynk) ----
  function describeArc(cx, cy, r, startDeg, endDeg){
    const toRad = d => (d - 90) * Math.PI / 180;
    const p = (deg) => ({ x: cx + r * Math.cos(toRad(deg)), y: cy + r * Math.sin(toRad(deg)) });
    const start = p(endDeg), end = p(startDeg);
    const largeArc = (endDeg - startDeg) <= 180 ? 0 : 1;
    return `M ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 1 ${end.x} ${end.y}`;
  }
  const GAUGE_START = -135, GAUGE_END = 135; // sapuan 270°

  const grid = document.getElementById('metricGrid');
  METRICS.forEach(m => {
    const card = document.createElement('div');
    card.className = 'card';
    const cx = 66, cy = 62, r = 46;
    const trackPath = describeArc(cx, cy, r, GAUGE_START, GAUGE_END);
    card.innerHTML = `
      <p class="card-label">${m.label}</p>
      <div class="gauge-wrap">
        <svg viewBox="0 0 132 112">
          <path class="gauge-track" d="${trackPath}"/>
          <path class="gauge-fill" id="arc-${m.pin}" d="${trackPath}"/>
        </svg>
        <div class="gauge-readout">
          <span class="card-value" id="val-${m.pin}">—</span><span class="card-unit">${m.unit}</span>
        </div>
      </div>
      <div class="gauge-range"><span>0</span><span>${m.max}</span></div>
      <div class="gauge-dot-row"><span class="dot" id="dot-${m.pin}"></span><span class="dot-lbl">live</span></div>
    `;
    grid.appendChild(card);
  });

  const root = document.documentElement.style;
  const connDot = document.getElementById('connDot');
  const connLabel = document.getElementById('connLabel');
  const errorNote = document.getElementById('errorNote');
  const lastUpdated = document.getElementById('lastUpdated');
  const refreshBtn = document.getElementById('refreshBtn');

  function setConnection(state){
    connDot.className = 'dot ' + (state === 'online' ? 'online' : state === 'error' ? 'error' : '');
    connLabel.textContent = state === 'online' ? 'Online' : state === 'error' ? 'Gagal ambil data' : 'Menghubungkan…';
    errorNote.classList.toggle('show', state === 'error');
    if(state === 'error'){
      errorNote.textContent = 'Nggak bisa ambil data terbaru. Kemungkinan device SAR1 sedang offline, koneksi internet halaman ini bermasalah, atau browser memblokir permintaan ke Blynk (CORS). Coba klik "Refresh sekarang", atau buka halaman ini lewat hosting (bukan file lokal) kalau errornya soal CORS.';
    }
  }

  function applyStatus(word){
    const style = STATUS_STYLE[word];
    document.getElementById('statusWord').textContent = word || '…';
    if(style){
      root.setProperty('--status-color', `var(${style.color})`);
      root.setProperty('--status-soft', `var(${style.soft})`);
      root.setProperty('--breathe-duration', style.breathe);
    }
  }

  // Warna arc gauge: CO2 pakai ambang asli dari firmware (800 / 1200 ppm),
  // gas lain diwarnai relatif terhadap skala maksimumnya.
  function gaugeColorVar(m, value){
    if(m.pin === 'v2'){
      if(value < 800) return '--clear';
      if(value < 1200) return '--haze';
      return '--smog';
    }
    const pct = value / m.max;
    if(pct < 0.6) return '--clear';
    if(pct < 0.85) return '--haze';
    return '--smog';
  }

  function setGauge(pin, value, max, colorVar){
    const path = document.getElementById(`arc-${pin}`);
    if(!path) return;
    const total = path.getTotalLength();
    const frac = Math.max(0, Math.min(1, value / max));
    path.setAttribute('stroke-dasharray', `${total * frac} ${total}`);
    path.style.stroke = `var(${colorVar})`;
  }

  function renderData(data){
    METRICS.forEach(m => {
      const raw = data[m.pin] ?? data[m.pin.toUpperCase()];
      const value = typeof raw === 'number' ? raw : parseFloat(raw);
      const el = document.getElementById(`val-${m.pin}`);
      const dot = document.getElementById(`dot-${m.pin}`);
      if(!isNaN(value)){
        el.textContent = value.toFixed(2);
        const colorVar = gaugeColorVar(m, value);
        setGauge(m.pin, value, m.max, colorVar);
        dot.style.background = `var(${colorVar})`;
        dot.style.boxShadow = `0 0 0 3px var(${colorVar}-soft)`;
      }
    });

    const co2 = data['v2'] ?? data['V2'];
    if(co2 !== undefined){
      document.getElementById('co2Caption').innerHTML = `<span>${parseFloat(co2).toFixed(0)} ppm</span>`;
    }

    const status = data['v7'] ?? data['V7'];
    if(status !== undefined) applyStatus(String(status).trim());

    lastUpdated.textContent = 'Diperbarui ' + new Date().toLocaleTimeString('id-ID');
    setConnection('online');
  }

  async function fetchData(){
    refreshBtn.disabled = true;
    try{
      const res = await fetch(`https://blynk.cloud/external/api/getAll?token=${BLYNK_TOKEN}`);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      renderData(data);
    }catch(err){
      console.error('Gagal ambil data Blynk:', err);
      setConnection('error');
    }finally{
      setTimeout(() => { refreshBtn.disabled = false; }, 800);
    }
  }

  refreshBtn.addEventListener('click', fetchData);
  fetchData();
  setInterval(fetchData, REFRESH_MS);
</script>

</body>
</html>
